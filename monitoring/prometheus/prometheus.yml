
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hookpulse_railway_production"
    scheme: "https"
    metrics_path: "/metrics"

    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/railway_metrics_token

    static_configs:
      - targets: ["hookpulse-production.up.railway.app"]
        labels:
          service: "hookpulse"
          env: "production"
