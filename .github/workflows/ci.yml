name: HookPulse CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Test Suite (SQLite)
        env:
          WEBHOOK_SECRET: testsecret
          DATABASE_URL: sqlite:////tmp/test_ci.db
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Run Test Suite (PostgreSQL)
        env:
          WEBHOOK_SECRET: testsecret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hookpulse_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hookpulse_test
        run: |
          pytest tests/ -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hookpulse:latest
